[project]
name = "koe-bridge"
version = "0.1.0"
description = "Open streaming Japanese-English speech-to-speech translator (small models, measured latency)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy==1.26.4",
  "scipy",
  "torch",
  "transformers",
  "sentencepiece",
  "faster-whisper",
  "pyopenjtalk",
  "setuptools==80.9.0",
  "style-bert-vits2",
  "sacrebleu",
  "jiwer",
  "pandas",
  "matplotlib",
  "typer",
  "huggingface_hub",
  "datasets",
  "kokoro",
  "espeakng-loader",
  "misaki",
  "silero-vad",
  "onnxruntime",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
koe-bridge = "koebridge.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
